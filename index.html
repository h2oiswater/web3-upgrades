<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>以太坊升级全记录 | Ethereum Hardfork History</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #111118;
            --bg-card: #16161e;
            --bg-card-hover: #1c1c26;
            --border-color: #2a2a3a;
            --border-hover: #3a3a50;
            --text-primary: #f0f0f5;
            --text-secondary: #9a9ab0;
            --text-muted: #6a6a80;
            --accent-blue: #627eea;
            --accent-blue-light: #8aa4f0;
            --accent-cyan: #00d4aa;
            --accent-purple: #a855f7;
            --accent-orange: #f59e0b;
            --accent-red: #ef4444;
            --accent-green: #22c55e;
            --gradient-eth: linear-gradient(135deg, #627eea 0%, #a855f7 50%, #00d4aa 100%);
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.4);
            --shadow-lg: 0 8px 24px rgba(0,0,0,0.5);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 20px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Hero Section */
        .hero {
            position: relative;
            padding: 80px 20px 60px;
            text-align: center;
            overflow: hidden;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(ellipse at 50% 30%, rgba(98, 126, 234, 0.08) 0%, transparent 50%),
                        radial-gradient(ellipse at 30% 70%, rgba(168, 85, 247, 0.06) 0%, transparent 50%),
                        radial-gradient(ellipse at 70% 60%, rgba(0, 212, 170, 0.06) 0%, transparent 50%);
            animation: pulse 15s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.7; }
        }

        .hero-content {
            position: relative;
            z-index: 1;
            max-width: 800px;
            margin: 0 auto;
        }

        .eth-logo {
            width: 64px;
            height: 64px;
            margin: 0 auto 24px;
            background: var(--gradient-eth);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: 800;
            color: white;
            box-shadow: 0 0 40px rgba(98, 126, 234, 0.3);
        }

        .hero h1 {
            font-size: 2.8rem;
            font-weight: 800;
            margin-bottom: 16px;
            background: var(--gradient-eth);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hero p {
            font-size: 1.1rem;
            color: var(--text-secondary);
            max-width: 600px;
            margin: 0 auto 32px;
        }

        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-top: 32px;
            flex-wrap: wrap;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--accent-blue-light);
        }

        .stat-label {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* Filters */
        .filters {
            padding: 0 20px 40px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .filter-tabs {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .filter-btn {
            padding: 8px 16px;
            border: 1px solid var(--border-color);
            background: var(--bg-secondary);
            color: var(--text-secondary);
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
            font-family: inherit;
            transition: all 0.2s;
        }

        .filter-btn:hover {
            border-color: var(--border-hover);
            color: var(--text-primary);
        }

        .filter-btn.active {
            background: var(--accent-blue);
            color: white;
            border-color: var(--accent-blue);
        }

        /* Timeline */
        .timeline-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px 80px;
            position: relative;
        }

        .timeline-line {
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            width: 2px;
            background: linear-gradient(to bottom, 
                transparent 0%, 
                var(--border-color) 5%, 
                var(--border-color) 95%, 
                transparent 100%);
            transform: translateX(-50%);
        }

        /* Cards */
        .upgrade-card {
            position: relative;
            margin-bottom: 40px;
            display: flex;
            align-items: flex-start;
            gap: 40px;
        }

        .upgrade-card:nth-child(odd) {
            flex-direction: row;
        }

        .upgrade-card:nth-child(even) {
            flex-direction: row-reverse;
        }

        .upgrade-card > * {
            flex: 1;
        }

        .timeline-dot {
            position: absolute;
            left: 50%;
            top: 24px;
            width: 16px;
            height: 16px;
            background: var(--bg-primary);
            border: 3px solid var(--accent-blue);
            border-radius: 50%;
            transform: translateX(-50%);
            z-index: 2;
            transition: all 0.3s;
        }

        .upgrade-card:hover .timeline-dot {
            background: var(--accent-blue);
            box-shadow: 0 0 16px rgba(98, 126, 234, 0.5);
        }

        .timeline-date {
            position: absolute;
            left: 50%;
            top: 48px;
            transform: translateX(-50%);
            font-size: 0.75rem;
            color: var(--text-muted);
            white-space: nowrap;
            text-align: center;
        }

        .card-content {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 28px;
            transition: all 0.3s;
            cursor: pointer;
        }

        .card-content:hover {
            border-color: var(--border-hover);
            background: var(--bg-card-hover);
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }

        .card-icon {
            width: 40px;
            height: 40px;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            flex-shrink: 0;
        }

        .card-title-group {
            flex: 1;
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .card-subtitle {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .card-desc {
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin-bottom: 16px;
            line-height: 1.6;
        }

        .eip-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .eip-tag {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 10px;
            background: rgba(98, 126, 234, 0.1);
            border: 1px solid rgba(98, 126, 234, 0.2);
            border-radius: 6px;
            font-size: 0.8rem;
            color: var(--accent-blue-light);
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
        }

        .eip-tag:hover {
            background: rgba(98, 126, 234, 0.2);
            border-color: var(--accent-blue);
            color: white;
        }

        .eip-tag .eip-num {
            font-family: 'SF Mono', Monaco, monospace;
            font-weight: 600;
        }

        .eip-tag.major {
            background: rgba(245, 158, 11, 0.1);
            border-color: rgba(245, 158, 11, 0.3);
            color: var(--accent-orange);
        }

        .eip-tag.major:hover {
            background: rgba(245, 158, 11, 0.2);
            border-color: var(--accent-orange);
            color: white;
        }

        .card-meta {
            display: flex;
            gap: 16px;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid var(--border-color);
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .card-meta span {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* Detail Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .modal-overlay.active {
            display: flex;
            opacity: 1;
        }

        .modal-content {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-xl);
            max-width: 700px;
            width: 100%;
            max-height: 85vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transform: scale(0.95);
            transition: transform 0.3s;
        }

        .modal-overlay.active .modal-content {
            transform: scale(1);
        }

        .modal-header {
            padding: 24px 28px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .modal-title {
            font-size: 1.25rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .modal-badge {
            padding: 3px 10px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-family: monospace;
            font-weight: 600;
        }

        .modal-close {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 1px solid var(--border-color);
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .modal-close:hover {
            background: var(--border-color);
            color: var(--text-primary);
        }

        .modal-body {
            padding: 24px 28px;
            overflow-y: auto;
            flex: 1;
        }

        .detail-section {
            margin-bottom: 24px;
        }

        .detail-section:last-child {
            margin-bottom: 0;
        }

        .detail-label {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .detail-text {
            color: var(--text-secondary);
            line-height: 1.7;
            font-size: 0.95rem;
        }

        .detail-text strong {
            color: var(--text-primary);
        }

        .ai-summary {
            background: linear-gradient(135deg, rgba(98, 126, 234, 0.08) 0%, rgba(168, 85, 247, 0.08) 100%);
            border: 1px solid rgba(98, 126, 234, 0.15);
            border-radius: var(--radius-md);
            padding: 16px;
        }

        .ai-summary .detail-label {
            color: var(--accent-blue-light);
        }

        .tech-details {
            background: var(--bg-card);
            border-radius: var(--radius-md);
            padding: 16px;
            font-family: 'SF Mono', Monaco, monospace;
            font-size: 0.85rem;
            color: var(--text-secondary);
            overflow-x: auto;
        }

        .tech-details code {
            color: var(--accent-cyan);
        }

        .impact-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
        }

        .impact-tag {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
        }

        .impact-high {
            background: rgba(239, 68, 68, 0.15);
            color: var(--accent-red);
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .impact-medium {
            background: rgba(245, 158, 11, 0.15);
            color: var(--accent-orange);
            border: 1px solid rgba(245, 158, 11, 0.2);
        }

        .impact-low {
            background: rgba(34, 197, 94, 0.15);
            color: var(--accent-green);
            border: 1px solid rgba(34, 197, 94, 0.2);
        }

        /* Mobile */
        @media (max-width: 768px) {
            .hero h1 {
                font-size: 2rem;
            }

            .timeline-line {
                left: 20px;
            }

            .upgrade-card,
            .upgrade-card:nth-child(odd),
            .upgrade-card:nth-child(even) {
                flex-direction: column;
                padding-left: 44px;
                gap: 12px;
            }

            .timeline-dot {
                left: 20px;
            }

            .timeline-date {
                left: 20px;
                top: 52px;
                transform: none;
                text-align: left;
            }

            .stats-bar {
                gap: 24px;
            }

            .stat-value {
                font-size: 1.5rem;
            }
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-primary);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--border-hover);
        }

        /* Animations */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .upgrade-card {
            animation: fadeInUp 0.5s ease forwards;
            opacity: 0;
        }

        .upgrade-card:nth-child(1) { animation-delay: 0.05s; }
        .upgrade-card:nth-child(2) { animation-delay: 0.1s; }
        .upgrade-card:nth-child(3) { animation-delay: 0.15s; }
        .upgrade-card:nth-child(4) { animation-delay: 0.2s; }
        .upgrade-card:nth-child(5) { animation-delay: 0.25s; }
        .upgrade-card:nth-child(6) { animation-delay: 0.3s; }
        .upgrade-card:nth-child(7) { animation-delay: 0.35s; }
        .upgrade-card:nth-child(8) { animation-delay: 0.4s; }
        .upgrade-card:nth-child(9) { animation-delay: 0.45s; }
        .upgrade-card:nth-child(10) { animation-delay: 0.5s; }
        .upgrade-card:nth-child(11) { animation-delay: 0.55s; }
        .upgrade-card:nth-child(12) { animation-delay: 0.6s; }
        .upgrade-card:nth-child(13) { animation-delay: 0.65s; }
        .upgrade-card:nth-child(14) { animation-delay: 0.7s; }
        .upgrade-card:nth-child(15) { animation-delay: 0.75s; }
        .upgrade-card:nth-child(16) { animation-delay: 0.8s; }
        .upgrade-card:nth-child(17) { animation-delay: 0.85s; }
        .upgrade-card:nth-child(18) { animation-delay: 0.9s; }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div class="hero">
        <div class="hero-content">
            <div class="eth-logo">Ξ</div>
            <h1>以太坊升级全记录</h1>
            <p>从 Frontier 到 Fusaka，追踪以太坊协议的每一次进化——包含历次硬分叉、核心 EIP 及技术演进路线图</p>

                <div class="stat-item">
                    <div class="stat-value">100+</div>
                    <div class="stat-label">核心 EIP</div>
                </div>
            </div>
        </div>
    </div>

    <div class="filters">
        <div class="filter-tabs">
            <button class="filter-btn active" data-filter="all">全部</button>
            <button class="filter-btn" data-filter="consensus">共识层</button>

        </div>
    </div>

    <div class="timeline-container" id="timeline">
        <div class="timeline-line"></div>
    </div>

    <!-- Detail Modal -->
    <div class="modal-overlay" id="modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title" id="modalTitle">EIP 详情</div>
                <button class="modal-close" onclick="closeModal()">&times;</button>

            <div class="modal-body" id="modalBody"></div>
        </div>
    </div>

                aiSummary: "RSA 签名验证更便宜。ModExp（模幂运算）是 RSA 的核心运算，这次重新定价使基于 RSA 的 zk-SNARK 验证器和传统签名验证更经济。",
                impact: "low",
                category: "密码学"
            },
            "EIP-2929": {

            "EIP-3198": {

            "EIP-3541": {

                aiSummary: "为未来 EOF（EVM Object Format）预留空间。0xEF 被保留作为新版本 EVM 字节码格式的前缀标记，防止现有合约意外使用该前缀造成向后兼容问题。",

            "EIP-3554": {

            "EIP-5133": {

                aiSummary: "PoW 时代的'死刑执行令'。这是最后一次推迟难度炸弹——合并定在 2022 年 9 月，合并后 PoS 不再需要难度调整机制，难度炸弹将永久成为历史。",
                impact: "medium",
                category: "协议基础"
            },
            "EIP-3651": {
                original: "在交易开始时预热 COINBASE 地址，使 COINBASE 在首次访问时按 'warm access'（100 gas）计费而非 'cold access'（2600 gas）。",
                aiSummary: "降低验证者直接收款成本。The Merge 后 COINBASE 是验证者的 fee recipient，预热后 gas 成本从 2600 降至 100，让验证者奖励提取更便宜。",
                impact: "low",
                category: "经济/优化"
            },
            "EIP-3855": {
                original: "新增 PUSH0 操作码（0x5f），将 0 推入 EVM 堆栈，gas 成本为 2。",
                aiSummary: "一个字节优化带来的大节省。以前将 0 推入堆栈需要 PUSH1 0x00（2 字节），现在 PUSH0 只需 1 字节。看似微小，但大型合约可减少数百字节部署成本。",
                impact: "low",
                category: "协议基础"
            },
            "EIP-3860": {
                original: "限制合约 initcode 最大为 49152 字节（2 * 0x6000），并对每 32 字节的 initcode words 收取额外 2 gas。",
                aiSummary: "为 EOF 和 Verkle 树做准备。限制 initcode 大小可以简化未来的 EVM 对象格式升级，同时防止超大 initcode 带来的验证负担。",
                impact: "low",
                category: "协议基础"
            },
            "EIP-6049": {
                original: "正式弃用 SELFDESTRUCT 操作码。SELFDESTRUCT 仍保留在协议中，但文档标记为已弃用，未来的升级可能会限制或删除它。",
                aiSummary: "为未来 statelessness（无状态性）扫清障碍。SELFDESTRUCT 允许合约删除自己并强制将 ETH 发送到任意地址，这在 Verkle 树和无状态客户端设计中造成困难。弃用宣告标志着它的终结倒计时。",
                impact: "medium",
                category: "协议基础"
            },
            "EIP-4788": {
                original: "在每个执行层区块中暴露信标链区块根。信标链区块根被写入一个系统合约（BEACON_ROOTS），合约地址为 0x000F3df6D732807Ef1319fB7B8bB8522d0Beac02，使 EVM 合约可以无需信任地读取共识层状态。",
                aiSummary: "执行层和共识层的'直连通道'。合约可以读取信标链数据来做 staking 衍生品定价、验证者状态检查等，不需要依赖中心化预言机。",
                impact: "medium",
                category: "共识/协议"
            },
            "EIP-5656": {
                original: "新增 MCOPY 操作码（0x5e），提供高效的内存复制功能，gas 成本为 3 + 3 * (字字数)。比现有方案（使用 MLOAD/MSTORE 循环）更省 gas 和更快速。",
                aiSummary: "内存操作的性能提升。大型数据复制（如 ABI 编码、结构体拷贝）以前需要逐字操作，MCOPY 让内存块整体复制成为可能，提升合约执行效率。",
                impact: "low",
                category: "协议基础"
            },
            "EIP-6780": {
                original: "限制 SELFDESTRUCT：只有在同一交易中创建并自毁的合约才能将 ETH 转移到指定地址。现有的自毁合约在 Cancun 后行为改变，不再删除代码和存储。",
                aiSummary: "SELFDESTRUCT 的'温和安乐死'。不直接删除操作码，而是限制其破坏性行为——合约不再能永久删除自己的代码和存储。这是向完全删除 SELFDESTRUCT 的过渡步骤。",
                impact: "medium",
                category: "协议基础"
            },
            "EIP-7516": {
                original: "新增 BLOBBASEFEE 操作码（0x4a），返回当前区块的 blob 基础费用（blob base fee per gas），gas 成本为 2。",
                aiSummary: "让合约感知 L2 成本。Rollup 合约可以读取 blob 费用动态调整其数据发布策略，在费用低时多发布、高时缓存，实现智能成本管理。",
                impact: "low",
                category: "协议基础"
            },
            "EIP-7044": {
                original: "共识层变更：使自愿退出签名消息永不过期。质押者签署一次退出消息后，该签名在任何 future epoch 都有效，不再受原始签名的有效期限制。",
                aiSummary: "质押者的'永久逃生权'。以前退出消息签名有过期时间，质押者需要定期重新签名。现在一次签名永久有效，极大提升对第三方节点运营商的制衡能力。",
                impact: "medium",
                category: "质押/共识"
            },
            "EIP-7045": {
                original: "共识层变更：增加 attestation 的包含窗口，从之前的 1 个 epoch 增加到当前 epoch 和下一个 epoch，给验证者更多时间提交证明。",
                aiSummary: "共识层的小容错提升。验证者网络偶尔延迟时，attestation 有更大的被包含窗口，减少因网络抖动导致的错过奖励。",
                impact: "low",
                category: "质押/共识"
            },
            "EIP-6110": {
                original: "共识层变更：将验证者存款直接提交到执行层区块中，而非通过 deposit 合约事件来传递。存款数据现在作为执行层区块的一部分直接可用。",
                aiSummary: "简化存款验证流程。以前共识层需要监听执行层的事件日志来获取新存款，现在存款数据直接在区块中可用，减少共识层对执行层事件的依赖，提升可靠性。",
                impact: "medium",
                category: "质押/共识"
            }

        // Render
        function renderTimeline(filter = 'all') {
            const container = document.getElementById('timeline');
            // Remove existing cards
            const existing = container.querySelectorAll('.upgrade-card');
            existing.forEach(e => e.remove());

            const filtered = filter === 'all' 
                ? upgrades 
                : upgrades.filter(u => u.type.includes(filter));

            filtered.forEach((upgrade, idx) => {
                const card = document.createElement('div');
                card.className = 'upgrade-card';
                card.dataset.index = idx;

                const featuresHtml = upgrade.features.map(f => {
                    const majorClass = f.major ? 'major' : '';
                    const eipPart = f.eip ? `<span class="eip-num">${f.eip}</span>` : '';
                    const namePart = f.name;
                    return `<span class="eip-tag ${majorClass}" data-eip="${f.eip}" data-name="${f.name}" data-desc="${f.desc || ''}">${eipPart}${eipPart ? ' ' : ''}${namePart}${f.major ? ' ★' : ''}</span>`;
                }).join('');

                const year = upgrade.date.split('-')[0];

                card.innerHTML = `
                    <div></div>
                    <div class="timeline-dot"></div>
                    <div class="timeline-date">${upgrade.displayDate}</div>
                    <div class="card-content" onclick="showUpgradeDetail(${upgrades.indexOf(upgrade)})">
                        <div class="card-header">
                            <div class="card-icon" style="background: linear-gradient(135deg, rgba(98,126,234,0.2), rgba(168,85,247,0.2));">${upgrade.icon}</div>
                            <div class="card-title-group">
                                <div class="card-title">${upgrade.name}</div>
                                <div class="card-subtitle">区块 ${upgrade.block}</div>
                            </div>
                        </div>
                        <div class="card-desc">${upgrade.desc}</div>
                        <div class="eip-list">
                            ${featuresHtml}
                        </div>
                        <div class="card-meta">
                            <span>📅 ${upgrade.displayDate}</span>
                            <span>🔢 ${upgrade.features.length} 项特性</span>
                            ${upgrade.type.includes('major') ? '<span>⭐ 里程碑</span>' : ''}
                        </div>
                    </div>
                `;

                // For even cards, adjust layout
                if (filtered.indexOf(upgrade) % 2 === 1) {
                    // The layout is handled by CSS nth-child, but we need to ensure proper DOM order
                }

                container.appendChild(card);
            });

            // Re-attach EIP click handlers
            document.querySelectorAll('.eip-tag').forEach(tag => {
                tag.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const eip = tag.dataset.eip;
                    const name = tag.dataset.name;
                    const desc = tag.dataset.desc;
                    if (eip && eipDetails[eip]) {
                        showEIPDetail(eip, name);
                    } else {
                        showGenericDetail(name, desc, eip);
                    }
                });
            });
        }

        // Modal functions
        function showEIPDetail(eip, name) {
            const detail = eipDetails[eip];
            const modal = document.getElementById('modal');
            const title = document.getElementById('modalTitle');
            const body = document.getElementById('modalBody');

            title.innerHTML = `
                <span style="font-family: monospace; background: var(--bg-card); padding: 4px 10px; border-radius: 4px; border: 1px solid var(--border-color);">${eip}</span>
                ${name}
            `;

            body.innerHTML = `
                <div class="detail-section">
                    <div class="detail-label">🔍 技术规格原文</div>
                    <div class="detail-text">${detail.original}</div>
                </div>
                <div class="detail-section ai-summary">
                    <div class="detail-label">🤖 AI 解读</div>
                    <div class="detail-text">${detail.aiSummary}</div>
                </div>
                <div class="detail-section">
                    <div class="detail-label">📊 影响评估</div>
                    <div class="impact-tags">
                        <span class="impact-tag impact-${detail.impact}">${detail.impact === 'high' ? '🔴 高影响' : detail.impact === 'medium' ? '🟡 中影响' : '🟢 低影响'}</span>
                        <span class="impact-tag" style="background: var(--bg-card); color: var(--text-secondary); border: 1px solid var(--border-color);">${detail.category}</span>
                    </div>
                </div>
            `;

            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function showGenericDetail(name, desc, eip) {
            const modal = document.getElementById('modal');
            const title = document.getElementById('modalTitle');
            const body = document.getElementById('modalBody');

            title.innerHTML = eip 
                ? `<span style="font-family: monospace; background: var(--bg-card); padding: 4px 10px; border-radius: 4px; border: 1px solid var(--border-color);">${eip}</span> ${name}`
                : name;

            body.innerHTML = `
                <div class="detail-section">
                    <div class="detail-label">📝 描述</div>
                    <div class="detail-text">${desc}</div>
                </div>
                <div class="detail-section ai-summary">
                    <div class="detail-label">🤖 AI 补充</div>
                    <div class="detail-text">该特性是相应以太坊升级的一部分，具体技术细节可参考官方 EIP 文档。</div>
                </div>
            `;

            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function showUpgradeDetail(index) {
            const upgrade = upgrades[index];
            const modal = document.getElementById('modal');
            const title = document.getElementById('modalTitle');
            const body = document.getElementById('modalBody');

            title.innerHTML = `${upgrade.icon} ${upgrade.name}`;

            const featuresHtml = upgrade.features.map(f => {
                const detail = f.eip && eipDetails[f.eip];
                return `
                    <div style="padding: 12px; background: var(--bg-card); border-radius: var(--radius-sm); margin-bottom: 8px; border: 1px solid var(--border-color);">
                        <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 4px;">
                            ${f.eip ? `<code style="background: rgba(98,126,234,0.15); color: var(--accent-blue-light); padding: 2px 8px; border-radius: 4px; font-size: 0.8rem;">${f.eip}</code>` : ''}
                            <strong style="color: var(--text-primary);">${f.name}</strong>
                            ${f.major ? '<span style="color: var(--accent-orange); font-size: 0.8rem;">★ 核心</span>' : ''}
                        </div>
                        <div style="color: var(--text-secondary); font-size: 0.9rem;">${f.desc}</div>
                        ${detail ? `<div style="margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border-color); color: var(--text-muted); font-size: 0.85rem;"><strong>AI 总结：</strong>${detail.aiSummary}</div>` : ''}
                    </div>
                `;
            }).join('');

            body.innerHTML = `
                <div class="detail-section">
                    <div class="detail-label">📅 升级信息</div>
                    <div class="detail-text">
                        <strong>时间：</strong>${upgrade.displayDate}<br>
                        <strong>区块高度：</strong>${upgrade.block}<br>
                        <strong>类型：</strong>${upgrade.type.map(t => ({consensus: '共识层', execution: '执行层', l2: '扩容/L2', economic: '经济模型', security: '安全', major: '里程碑'}[t])).join('、')}
                    </div>
                </div>
                <div class="detail-section">
                    <div class="detail-label">📝 升级概要</div>
                    <div class="detail-text">${upgrade.desc}</div>
                </div>
                <div class="detail-section">
                    <div class="detail-label">🔧 包含的 EIP/特性</div>
                    ${featuresHtml}
                </div>
            `;

            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            const modal = document.getElementById('modal');
            modal.classList.remove('active');
            document.body.style.overflow = '';
        }

        // Filter handlers
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                renderTimeline(btn.dataset.filter);
            });
        });

        // Close modal on overlay click
        document.getElementById('modal').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) closeModal();
        });

        // Close on Escape
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });

        // Init
        renderTimeline();
    </script>
</body>
</html>
